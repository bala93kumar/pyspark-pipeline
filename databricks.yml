bundle:
  name: pyspark-pipeline

variables:
  catalog:
    description: "Unity Catalog name for the target workspace"
    default: dbx_demo_dev_ws_7405605201845024
  job_permission:
    description: "Permission level granted to the data_engineers group on the job"
    default: CAN_MANAGE_RUN

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405605201845024.4.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}/${workspace.current_user.short_name}
    variables:
      catalog: dbx_demo_dev_ws_7405605201845024
      job_permission: CAN_MANAGE_RUN

  prod:
    mode: production
    workspace:
      host: https://adb-7405618385351801.1.azuredatabricks.net
    variables:
      catalog: dbx_demo_prod_ws_7405618385351801
      job_permission: CAN_VIEW

resources:
  jobs:
    marketing_etl_job:
      name: "[${bundle.target}] Marketing Medallion ETL (Bronze -> Silver -> Gold)"
      permissions:
        - group_name: data_engineers
          level: ${var.job_permission}
      tasks:
        - task_key: run_medallion_pipeline
          spark_python_task:
            python_file: src/etl/run_pipeline.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--bundle-root"
              - "${workspace.file_path}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
